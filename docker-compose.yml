services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: always
    environment:
      - REDIS_ARGS=--requirepass mypassword
    ports:
      - "6379:6379"
      - "8001:8001"

  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    depends_on:
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env